[project]
name = "aion-knowledge"
version = "0.1.0"
description = "Knowledge base kernel — multi-source ingestion, processing, and multi-path retrieval"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0",
    "alembic>=1.13",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-ollama>=0.3.0",
    "beautifulsoup4>=4.14.2",
    "ebooklib>=0.18",
    "lxml>=6.1.0",
    "markdownify>=0.13.1",
    "markitdown[docx,pdf,xls,xlsx]>=0.1.3",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "pillow>=12.0.0",
    "playwright>=1.55.0",
    "pypdf>=6.1.3",
    "pypdfium2>=5.9.0",
    "python-docx>=1.2.0",
    "xlrd>=2.0.0",
    "trafilatura>=2.0.0",
    "networkx>=3.3",
    "graspologic>=3.0",
    "mcp>=1.23.1",
    "neo4j>=5.0.0,<7.0.0",
    "boto3>=1.43",
    "pytesseract>=0.3.10",
    "pgvector>=0.4.0",
    "openai>=1.0",
    "tiktoken>=0.7",
    "starlette>=0.38",
    "botocore>=1.35",
    "umap-learn>=0.5",
    "xxhash>=3.5",
    "jieba>=0.42.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]
odl = ["opendataloader-pdf>=2.4.7"]
paddle-ocr = [
    "paddleocr>=3.7.0",
    "onnxruntime",
    "opencv-contrib-python",  # paddle.py 直接 import cv2（imdecode）；与 paddlex 硬钉版本一致，避免双 cv2 冲突
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aion_knowledge*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = [
    "integration: marks tests as integration tests (requires real DB + AGE + LLM)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]  # 暂不限制单行长度

[tool.mypy]
python_version = "3.12"
strict = true
follow_imports = "normal"

# 以下包无 stubs 或为可选依赖，逐一声明豁免
[[tool.mypy.overrides]]
module = [
    "pgvector.*",
    "paddleocr.*",   # 可选依赖（paddle-ocr 组），装与不装两种环境均需豁免
    "cv2.*",         # 同上
    "openai>=1.0",
    "tiktoken>=0.7",
    "starlette>=0.38",
    "botocore>=1.35",
    "umap-learn>=0.5",
    "xxhash>=3.5",    "psycopg2.*",      # 无 stubs
    "trafilatura.*",
    "graspologic.*",
    "pypdfium2.*",
    "markitdown.*",
    "playwright.*",
    "boto3.*",
    "botocore.*",
    "jieba.*",
]
ignore_missing_imports = true
